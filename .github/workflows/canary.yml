name: Nightly Canary Check

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: Canary Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Canary E2E Test
        env:
          CANARY_URL: ${{ secrets.CANARY_URL }}
        run: npm run test:canary

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Canary Drift Failure: ${new Date().toISOString().slice(0, 10)}`,
              body: `The automated nightly canary check detected a contract violation or failure on the live Squarespace canary site.\n\nPlease inspect the workflow run logs and verify if Squarespace changed DOM attributes or class selectors in \`src/adapters/squarespace.ts\`.`,
              labels: ['canary-drift', 'bug']
            });
